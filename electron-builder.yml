appId: net.torastar.gw2squaded
productName: GW2-Squaded
directories:
  output: dist
  buildResources: build

# out/ is electron-vite's build output (main/preload/renderer); data/game-data is the static
# GW2 API cache read at runtime by src/main/game-data/load-game-data.ts (shipped via
# extraResources below, not asar, so it lands at process.resourcesPath/data/game-data).
files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: data/game-data
    to: data/game-data

# In-app updates (see src/main/updater/auto-updater.ts) read from this repo's GitHub Releases via
# electron-updater. Only wired up for Windows/NSIS for now — no code signing for mac/linux, and
# electron-updater's Squirrel.Mac path requires a signed app to work at all.
publish:
  provider: github
  owner: vanwheels
  repo: GW2-Squaded

# better-sqlite3's native .node binding can't be dlopen'd from inside an asar archive —
# unpack it (and any other native module) alongside app.asar instead.
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
